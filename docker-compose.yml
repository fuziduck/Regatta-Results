# docker-compose.yml — SailScore (PRODUCTION)
#
# This is the default compose file: `docker compose up` deploys a hardened,
# production-shaped stack. For local development (hot reload, dev servers,
# your real data volume) use the explicit dev file instead:
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Production setup:
#   1. cp .env.example .env        # fill in REAL values (see .env.example)
#   2. docker compose up -d --build
#
# Production guarantees:
#   - ENV=production  (the backend refuses to start with weak JWT secrets,
#     a '*' CORS origin, a missing webmaster passcode, or a credential-less
#     MONGO_URL; API docs are disabled; HSTS is enabled)
#   - No uvicorn --reload, no React dev server
#   - MongoDB is internal-only (no host port) and requires credentials
#   - The backend is NOT exposed to the host at all
#   - The nginx frontend binds 127.0.0.1:8080 — reachable ONLY from the Ubuntu
#     host, where a HOST-INSTALLED Caddy terminates TLS (see deploy/)
#   - A fresh named volume (prod-mongo-data) with auth enabled from creation
#
# TLS is terminated by Caddy on the host (see deploy/Caddyfile +
# deploy/README.md). Nothing in this stack is exposed to the Internet:
# ports 8000 and 27017 are never published, and port 80 is loopback-only.
#
# Moving existing dev data here (optional, one-time): the dev stack keeps your
# real data in the external `regatta_mongodb_data` volume. To bring it into
# production, mongodump from the dev mongo and mongorestore into this one:
#   docker run --rm -v regatta_mongodb_data:/data/db mongo:7 mongodump --db regatta --out /dump
#   docker run --rm -v prod-mongo-data:/data/db mongo:7 \
#     mongorestore --uri mongodb://<user>:<pass>@mongodb:27017/regatta --db regatta /dump/regatta

services:
  mongodb:
    image: mongo:7
    container_name: sailscore-mongodb
    restart: unless-stopped
    networks:
      - sailscore-internal
    volumes:
      - prod-mongo-data:/data/db
    environment:
      # Required — the mongo entrypoint enables auth when these are set.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet",
             "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sailscore-backend
    restart: unless-stopped
    networks:
      - sailscore-internal
    # No ports: the backend is only reachable from the internal network.
    environment:
      ENV: production
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/regatta?authSource=admin
      DB_NAME: ${DB_NAME:-regatta}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      WEBMASTER_PASSCODE: ${WEBMASTER_PASSCODE:?set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env (never '*')}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-60}
      # Trusted reverse proxies whose X-Forwarded-For is honoured (the real
      # client IP for throttling/audit). Defaults to the pinned internal
      # network (172.28.0.0/16) — the only peer that can reach the backend is
      # the nginx frontend container. See the internal network definition
      # below; must match. Never "*" — forged headers must not be trusted.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.28.0.0/16}
      SMTP_HOST: ${SMTP_HOST:?set in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:?set in .env}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-30}
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sailscore-frontend
    restart: unless-stopped
    networks:
      - sailscore-internal
    ports:
      # Loopback-only: only the HOST-INSTALLED Caddy can reach the app. The
      # Internet can never talk to nginx directly (Caddy is the only entry
      # point, and it sanitises X-Forwarded-For before forwarding). The host
      # side is 8080 because the host-installed Caddy already owns port 80;
      # the container keeps listening on port 80 internally.
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  prod-mongo-data:      # fresh production volume (auth-enabled from creation)

networks:
  sailscore-internal:
    driver: bridge      # only the frontend's loopback-published port reaches the host
    ipam:
      config:
        # Pinned so TRUSTED_PROXY_IPS (backend env above) can name the exact
        # network the nginx container arrives from. Keep the two in sync.
        - subnet: 172.28.0.0/16
