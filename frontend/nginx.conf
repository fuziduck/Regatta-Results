# SailScore production nginx — serves the built SPA and proxies /api to the
# backend container over the internal Docker network.
#
# This server is bound to 127.0.0.1:80 ONLY (see docker-compose.yml) and is
# reachable solely from the HOST-INSTALLED Caddy reverse proxy, which
# terminates TLS and overwrites X-Forwarded-For with the real client IP.
# nginx passes that sanitised value through untouched.

# WebSocket upgrade map (http-level, used by the /api block below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (SPA document responses) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # React app CSP: the app uses Tailwind inline style attributes, loads
    # images from the app origin/data URLs and Unsplash, and fonts locally.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Uncomment when TLS is terminated here (or set in the TLS server block):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed assets; index.html must never be cached
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # API reverse proxy — the backend is never exposed directly. The only
    # path into this server is Caddy on the host (loopback bind), which
    # OVERWRITES X-Forwarded-For with the real client IP. nginx passes that
    # sanitised value through untouched (never appends its own $remote_addr,
    # which would be 127.0.0.1 from Caddy, or trust a client-supplied header).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (future-proof; not currently used).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
    }
}
