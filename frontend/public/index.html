<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0A369D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />        <meta name="apple-mobile-web-app-title" content="SailScore" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/sailscore-logo.png" />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/sailscore-logo.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <meta name="description" content="SailScore — club racing results & standings. Connecting sailing, one club at a time." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>SailScore</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <!-- Plausible Analytics: cookie-free, PII-free page-view tracking (the
             only analytics platform on this site). Hosted on our own Plausible
             instance; `data-domain` must match the site configured there.
             Pageviews fire on load and automatically on SPA route changes
             (pushState/popstate), so no router wiring is needed. Localhost is
             excluded automatically; custom events go through src/lib/analytics.js. -->
        <script defer data-domain="sailscore.co.uk" src="https://analytics.sailscore.co.uk/js/script.js"></script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

    </body>
</html>
